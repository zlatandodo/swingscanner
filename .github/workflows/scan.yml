name: Refresh scan data

# Manual only: run from the Actions tab via "Run workflow" when you want to
# refresh data/latest_results.json on GitHub. (Schedule removed on purpose —
# it was auto-committing and clobbering locally refreshed data.)

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scanner (full US universe)
        run: python swing_scanner.py --universe all

      - name: Commit refreshed data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/latest_results.json
          git diff --cached --quiet || git commit -m "chore: refresh scan data [skip ci]"
          git push
